name: Run Multiple Ansible Playbooks

on:
  push:
    branches:
      - dev-gitops

jobs:
  run_ansible_playbooks:
    runs-on: self-hosted

    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      CLIENT_POLICY_DOMAIN: ${{ secrets.CLIENT_POLICY_DOMAIN }}
      CLIENT_PASSWORD: ${{ secrets.CLIENT_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python and Ansible
        run: |
          python3 -m venv ~/ansible_venv
          source ~/ansible_venv/bin/activate
          pip install --upgrade pip ansible

      - name: Install Ansible Collections
        run: |
          source ~/ansible_venv/bin/activate
          ansible-galaxy collection install ansible.posix
          ansible-galaxy collection install ibm.storage_protect --force

      - name: Run Multiple Playbooks
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          source ~/ansible_venv/bin/activate
          
          EXIT_CODE=0

          declare -A PLAYBOOKS
          PLAYBOOKS["ClientInstall"]="tests/integration/targets/ba_client_install/test_ba_client_install_linux.yml"
          PLAYBOOKS["ServerInstall"]="tests/integration/targets/sp_server_install/test_sp_server_install.yml"
          PLAYBOOKS["AgentInstall"]="tests/integration/targets/storage_agent_configure/test_storage_agent_configure.yml"

          for NAME in "${!PLAYBOOKS[@]}"; do
            PLAYBOOK="${PLAYBOOKS[$NAME]}"
            echo "▶️ Running $NAME => $PLAYBOOK"

            if [[ "$NAME" == "ClientInstall" ]]; then
              EXTRA_VARS="{
                \"CLIENT_POLICY_DOMAIN\": \"${CLIENT_POLICY_DOMAIN}\",
                \"CLIENT_PASSWORD\": \"${CLIENT_PASSWORD}\",
                \"STORAGE_PROTECT_REQUEST_TIMEOUT\": 10,
                \"ba_client_version\": \"8.1.26.0\",
                \"BA_CLIENT_TAR_REPO_PATH\": \"/tmp/ba_client_install\"
              }"
            elif [[ "$NAME" == "ServerInstall" ]]; then
              EXTRA_VARS="{
                \"SERVER_INSTALL_PATH\": \"/opt/ibm/server\",
                \"SERVER_PORT\": 1500
              }"
            elif [[ "$NAME" == "AgentInstall" ]]; then
              EXTRA_VARS="{
                \"AGENT_LOG_PATH\": \"/var/log/agent\",
                \"AGENT_CONFIG\": \"/etc/agent/conf.yaml\"
              }"
            fi

            ansible-playbook -i inventory.yml "$PLAYBOOK" \
              --extra-vars "$EXTRA_VARS" || {
                echo "❌ $NAME playbook failed"
                EXIT_CODE=1
              }

            echo "✅ Completed: $NAME"
          done

          exit $EXIT_CODE



